name: CI

on:
  push:
    branches:
      - main
    # Pull requests keep running, because CI is a required check and a
    # skipped workflow never reports it.
    paths-ignore:
      - '.agents/**'
      - '.claude/skills/**'
      - '.codex/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default:
    name: CI
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.title != '[Release] Version packages'
      ) && (
        github.event_name != 'push' || (
          !contains(github.event.head_commit.message, '[Release] Version packages') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/bun-install
        with:
          generate: "true"

      - name: 🔬 Run PR gate
        run: bun check --ci
