name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default:
    name: CI
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.title != '[Release] Version packages'
      ) && (
        github.event_name != 'push' || (
          !contains(github.event.head_commit.message, '[Release] Version packages') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/bun-install
        with:
          generate: "true"

      - name: 🧠 Validate Skills
        run: bun run intent:validate

      - name: 📦 Build Packages
        run: bun build:pkg

      # KITCN_SKIP_LOCAL_BUILD is load-bearing on step order: it is only sound
      # because "📦 Build Packages" runs immediately above. Keep it on this step
      # and never job-wide.
      - name: 🔬 Run PR gate
        run: bun run check:ci
        env:
          KITCN_SKIP_LOCAL_BUILD: "1"
